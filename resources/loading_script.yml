resources:
  jobs:
    loading_script:
      name: loading_script
      description: Loads data from the darwin topic
      continuous:
        pause_status: UNPAUSED
      tasks:
        - task_key: loading-data-task
          python_wheel_task:
            package_name: rail_data_utility
            entry_point: loading-script
            named_parameters:
              volume_path: /Volumes/${var.catalog}/landing/landing_volume/darwin-topic
              flush_time: "60"
              stomp_host: darwin-dist-44ae45.nationalrail.co.uk
              darwin_topic: /topic/darwin.pushport-v16
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
