resources:
  jobs:
    loading_script:
      name: loading_script
      description: Loads data from the darwin topic
      # no explicit pause_status: development targets pause it, production runs it
      continuous: {}
      email_notifications:
        on_failure: ${var.notification_emails}
      tasks:
        - task_key: loading-data-task
          python_wheel_task:
            package_name: rail_data_utility
            entry_point: loading-script
            named_parameters:
              volume_path: /Volumes/${var.catalog}/landing/landing_volume/darwin-topic
              flush_time: "60"
              stomp_host: darwin-dist-44ae45.nationalrail.co.uk
              stomp_port: "61613"
              darwin_topic: /topic/darwin.pushport-v16
              client_id: rail-data-utility-${bundle.target}
              secret_scope: darwin-topic-creds
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
