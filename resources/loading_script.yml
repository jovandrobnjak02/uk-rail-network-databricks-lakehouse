resources:
  jobs:
    loading_script:
      name: loading_script
      description: Loads data from the darwin topic
      continuous:
        pause_status: UNPAUSED
      tasks:
        - task_key: loading-data-task
          python_wheel_task:
            package_name: rail_data_utility
            entry_point: loading-script
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - stomp-py
