# This is a Declarative Automation Bundle definition for remembering.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: remembering
  uuid: 832c454f-b368-4b08-b9b7-fc22ad561eae

include:
  - resources/*.yml

#artifacts:
#  python_artifact:
#    type: whl
#    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  local:
    mode: development
    default: true
    workspace:
      host: https://dbc-65884926-60b5.cloud.databricks.com
    variables:
      catalog: remembering_dev
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    workspace:
      host: https://dbc-65884926-60b5.cloud.databricks.com
    variables:
      catalog: remembering_dev
  test:
    mode: test
    workspace:
      host: https://dbc-65884926-60b5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jovancar13@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jovancar13@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: remembering_test
    permissions:
      - user_name: jovancar13@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-65884926-60b5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jovancar13@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jovancar13@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: remembering_prod
    permissions:
      - user_name: jovancar13@gmail.com
        level: CAN_MANAGE

resources:
  schemas:
    landing:
      name: landing
      catalog_name: ${var.catalog}
    bronze:
      name: bronze
      catalog_name: ${var.catalog}
    silver:
      name: silver
      catalog_name: ${var.catalog}
    gold:
      name: gold
      catalog_name: ${var.catalog}
  volumes:
    landing_volume:
      name: landing_volume
      schema_name: ${resources.schemas.landing.name}
      catalog_name: ${var.catalog}
      volume_type: "MANAGED"